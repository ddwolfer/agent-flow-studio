# 生活短文 —— 21:04 保底,無事件時發
# 來源:KG 74dd09f7

name: short_casual
display_name: 生活短文
description: 沒有事件時的黃金時段保底,幣圈相鄰的人味內容

material_sources:
  - 恐懼貪婪指數的眾生相
  - 非財經大熱題的幣圈視角
  - 交易者互動提問(問讀者,不講自己)
  - 當日或跨日 _extras 數據的白話延伸

best_material: |
  **跨日 _extras 對照是效果最好也最難被抄的素材。**
  例:7/29 BTC 64,343 日線指標 21.9(超賣)vs 8/6 BTC 64,562 指標 82.9(超買)
  —— 價差 0.3%,訊號完全相反。這種對照只有每天存檔的人做得出來。

instructions: |
  輕鬆、有人味,結尾一定是互動問句。
  可以有觀點和情緒,但重點是讓讀者想回答,不是讓讀者佩服。

hard_rules:
  - "禁止編造個人經歷 —— 可以問「你第一次爆倉在哪」,不可以寫「我第一次爆倉時…」"
  - 零 SMC 術語;指標要翻成白話
  - 純文字(配圖只在長文,保持單一變數)
