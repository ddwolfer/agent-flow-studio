# 事件短文 —— 15:58 / 21:04 檢查點,有事才發
#
# 「無觸發就靜默」是正常結果,不是失敗。為了發而發會稀釋整個帳號的訊噪比。

name: short_event
display_name: 事件短文
description: 只在明確事件發生時發的即時更新

triggers:
  - BTC/ETH 日內漲跌幅超過 3%
  - 現價觸及或跌破**已發布過**的關鍵位(必須對 _published.jsonl 驗證)
  - 廣場熱題爆發且與我方資產相關

instructions: |
  1-3 句,零預測,$標籤 1-2 個。

  **若與當日稍早的貼文是同一事件,必須換角度。**
  同一天可以講同一條線三次,但必須是三個不同層次:
  「守住了」→「盤中破了」→「為什麼要看收盤」。

  **維持「盤中不算、收盤才算」的標準,即使這次是好消息。**
  這條線從 7/24 講到現在,不能因為方向對自己有利就放寬。

hard_rules:
  - 若稍早已說「要看收盤」,不要再為同一個盤中波動發文 —— 那會自打嘴巴
  - 不喊單、不給進出場價位、不做價格預測
  - 純文字(配圖只在長文,保持單一變數以便成效比對)
