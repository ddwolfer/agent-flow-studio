# 待命素材 —— CLARITY Act(美國加密市場結構法案)
#
# 為什麼待命而不是直接發:題材本身很好,但沒有當日由頭時發出來會是一篇
# 沒人看的說明文。等有實際進展那天發,蹭度和新鮮度最高。
# 登記於 2026-07-29。

name: clarity_act
display_name: CLARITY Act 待命素材
description: 美國加密市場結構法案,等表決窗口有動作才發
registered: 2026-07-29

triggers:
  - 參議院排上議程 / 進行 cloture / 全院表決
  - 2026-08-10 表決窗口前後出現明確進展或明確破局
  - 三大爭議之一有突破(官員持倉揭露 / Section 604 / 穩定幣收益)
  - 廣場出現該題 >5k views 熱題

verified_facts: |
  查證於 2026-07-29,引用前請再確認是否已過時:
  - 2026-05-12 參院銀行委員會釋出 309 頁文本;05-14 以 15:9 通過送全院
  - 白宮原訂 7/4 前完成 → 未達成;07-23 多數黨領袖 Thune 稱暑休前難通過
  - 2026-08-10 為參議員返州前最後表決窗口;9 月僅剩約三週會期;11 月期中選舉
  - 尚未完成:全院 cloture(需 60 票)、與農業委員會姊妹法案整合、
    眾議院通過、總統簽署
  - 票數現實:共和黨 53 席,Hawley、Rand Paul 預期反對;民主黨僅 Gallego、
    Alsobrooks 投過贊成且均附條件
  - 三大爭議:①官員加密持倉道德揭露(Gillibrand 要求 vs 白宮反對)
    ②Section 604 非託管開發者豁免(DeFi 視為最重要創新 vs 地方檢察官協會
    稱妨礙刑事調查)③穩定幣收益(禁閒置餘額付息、允許活動獎勵;
    銀行家協會稱在 GENIUS Act 禁令上開漏洞,涉平台數十億營收)

angles:
  - name: Section 604 的張力
    note: 「保護開發者 vs 妨礙辦案」,零術語就能講清楚,最適合一般讀者
  - name: 票數算術
    note: 53 席但兩個自己人反對、民主黨只有兩張附條件票 —— 把政治現實講白
  - name: 慢變數 vs 短線
    note: 制度前進、價格不同步。**7/26 已用過此框架,再用必須換切角**

forbidden:
  - 不得寫「通過就會漲」或任何價格預測
  - "不得把「委員會通過」講成「法案通過」 —— 還缺四關(cloture/農委會整合/眾院/簽署)。這是幣圈內容常見的誤導,我們不跟。"
  - "8/10 不得寫成「大限 / 決戰日」;錯過是機率下降,不是法案死亡"
  - "hashtag 當天重新驗證確切字串(歷史熱題是簡體子題 #CLARITY法案拟奖励白帽黑客),驗不到降級中性標籤"
