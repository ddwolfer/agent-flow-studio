# 每日選文決策 —— v1.5 自主版
# 來源:KG 492e51d2。2026-07-22 起 user 授權自主決定並立即發布,事後可回「換」。

name: square_selection
display_name: 每日 A/B 自主選文
description: P1/P2/P3 優先序 + tie-break + 承諾優先

priority:
  P1:
    when: 有 >5k views 的熱題,且與 BTC/ETH/QQQ 相關
    pick: B
  P2:
    when: 無強熱題,但幣圈內部有劇情(已發布關鍵位被測試/收復/跌破、回扣兌現)
    pick: A
  P3:
    when: 跨資產分歧正在發展(QQQ 與幣圈不同調)
    pick: B

tie_break: |
  避免連兩天同資產同角度 —— 選比較新鮮的那個。
  這是**軟規則**,下面兩條硬規則可以覆寫它。

overrides:
  - name: 承諾優先
    rule: |
      **若前一天的貼文對某個關鍵位承諾過「要看收盤」,今天必須先回答。**
      這條優先於選題新鮮度,也優先於 tie-break。承諾了不答就是失信,
      而失信一次就把整個「公開紀錄」的價值歸零。
      實作:每天先取昨日日線 close 與該位階比對,再決定選題。
  - name: 問責優先
    rule: |
      自設的關鍵位被打破時,**問責的連貫性優先於角度新鮮度**,
      即使那會造成連兩天 A。一個只在對的時候大聲的帳號,
      跟一個從不認錯的帳號一樣不可信。
  - name: 待命素材觸發
    rule: |
      standby/ 目錄下任一素材的觸發條件成立時,優先採用該題材,
      並嚴格遵守該檔登記的禁區。

publish_flow: |
  自主決定 → 立即發布 → Telegram 推兩篇完整原文 + 一句理由 + 「不同意回『換』」。
  不建 fallback 排程(已經發了)。user 事後回「換」才改發另一篇。
